project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "posts/**/*.qmd"
  resources:
    - assets/arash-bagherabadi.vcf
    - images/contact-qr.svg
    - images/hero-spatial-layers.webp
    - images/profile-professional.webp
    - images/small-worlds-large-systems.webp

website:
  title: "Arash Bagherabadi"
  site-url: "https://arashabadi.github.io"
  description: "Small Worlds, Large Systems: notes on biology, computation, making, and useful detours."

format:
  html:
    theme: cosmo
    css: styles.css
    include-before-body: site-header.html
    include-after-body: site-after-body.html
    toc: false
    code-fold: true
    code-tools: true
    self-contained: false
    anchor-sections: false
    link-external-icon: false
    link-external-newwindow: true

execute:
  freeze: auto

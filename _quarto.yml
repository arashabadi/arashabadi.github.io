project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "posts/**/*.qmd"
  resources:
    - robots.txt
    - llms.txt
    - assets/arash-bagherabadi.vcf
    - assets/hero-cells.js
    - assets/vendor/three.core.min.js
    - assets/vendor/three.module.min.js
    - assets/vendor/three.LICENSE.txt
    - images/contact-qr.svg
    - images/hero-spatial-layers.webp
    - images/hero-spatial-girih.webp
    - images/profile-professional.webp
    - images/small-worlds-large-systems.webp
    - images/publication-dna-methylation-ml.webp
    - images/publication-ccnd1-idcm.webp
    - images/publication-ntrk1-prostate.webp
    - images/publication-kinase-epigenetic.webp
    - images/project-elispot-reader.webp
    - images/project-cellrank-learning-lab.jpg
    - images/project-patoq-book.webp
    - images/project-codefest-embedding-mafia.webp

website:
  title: "Arash Bagherabadi"
  site-url: "https://arashabadi.github.io"
  description: "Arash Bagherabadi (Arash B. Abadi): spatial biology, computational immunology, single-cell bioinformatics, scientific machine learning, laboratory robotics, and educational making."
  open-graph: true
  twitter-card: true

lang: en

format:
  html:
    theme: cosmo
    css: styles.css
    include-before-body: site-header.html
    include-after-body: site-after-body.html
    toc: false
    code-fold: false
    code-tools: false
    self-contained: false
    anchor-sections: false
    link-external-icon: false
    link-external-newwindow: true

execute:
  freeze: auto

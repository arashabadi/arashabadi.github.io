<script>
(function () {
  const body = document.body;
  const header = document.querySelector('[data-site-header]');
  const menu = document.getElementById('site-menu');
  const menuButton = document.querySelector('.site-menu-button');
  const menuClosers = document.querySelectorAll('[data-menu-close]');
  const themeButton = document.querySelector('.theme-toggle');

  function setTheme(theme, persist) {
    const light = theme === 'light';
    document.documentElement.dataset.theme = light ? 'light' : 'dark';
    if (themeButton) {
      const label = light ? 'Use dark theme' : 'Use light theme';
      const icon = themeButton.querySelector('i');
      themeButton.setAttribute('aria-label', label);
      themeButton.setAttribute('title', label);
      if (icon) icon.className = light ? 'bi bi-moon-stars' : 'bi bi-sun';
    }
    if (persist) {
      try {
        window.localStorage.setItem('arash-site-theme', light ? 'light' : 'dark');
      } catch (error) {
        // Theme switching still works for the current page.
      }
    }
  }

  setTheme(document.documentElement.dataset.theme === 'light' ? 'light' : 'dark', false);
  themeButton && themeButton.addEventListener('click', function () {
    setTheme(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light', true);
  });

  function setMenu(open) {
    if (!menu || !menuButton) return;
    body.classList.toggle('menu-open', open);
    menu.classList.toggle('is-open', open);
    menu.setAttribute('aria-hidden', String(!open));
    menuButton.setAttribute('aria-expanded', String(open));
    menuButton.setAttribute('aria-label', open ? 'Close navigation' : 'Open navigation');
    if (open) {
      const firstLink = menu.querySelector('a');
      window.setTimeout(function () { firstLink && firstLink.focus(); }, 150);
    } else {
      menuButton.focus({ preventScroll: true });
    }
  }

  menuButton && menuButton.addEventListener('click', function () {
    setMenu(menuButton.getAttribute('aria-expanded') !== 'true');
  });
  menuClosers.forEach(function (closer) {
    closer.addEventListener('click', function () { setMenu(false); });
  });
  menu && menu.querySelectorAll('a').forEach(function (link) {
    link.addEventListener('click', function () { setMenu(false); });
  });

  window.addEventListener('scroll', function () {
    header && header.classList.toggle('is-scrolled', window.scrollY > 24);
  }, { passive: true });

  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape') {
      setMenu(false);
      const dialog = document.getElementById('save-contact-dialog');
      if (dialog && dialog.open) dialog.close();
    }
  });

  const dialog = document.getElementById('save-contact-dialog');
  if (dialog) {
    let promptScrollY = window.scrollY;
    dialog.querySelectorAll('[data-dialog-close]').forEach(function (button) {
      button.addEventListener('click', function () { dialog.close(); });
    });
    dialog.addEventListener('click', function (event) {
      if (event.target === dialog) dialog.close();
    });
    dialog.addEventListener('close', function () {
      window.scrollTo(0, promptScrollY);
    });

    const mobileLike = window.matchMedia('(pointer: coarse)').matches || window.innerWidth <= 900;
    const forcePrompt = new URLSearchParams(window.location.search).get('prompt') === '1';
    if (mobileLike && (forcePrompt || !window.sessionStorage.getItem('arash-contact-prompt-seen'))) {
      if (!forcePrompt) window.sessionStorage.setItem('arash-contact-prompt-seen', 'true');
      window.setTimeout(function () {
        promptScrollY = window.scrollY;
        dialog.showModal();
        const saveAction = dialog.querySelector('.dark-action');
        saveAction && saveAction.focus({ preventScroll: true });
      }, 550);
    }
  }

  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const revealTargets = document.querySelectorAll('.home-page section:not(.hero) .section-inner');
  if (!reducedMotion && revealTargets.length && 'IntersectionObserver' in window) {
    const revealObserver = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (!entry.isIntersecting) return;
        entry.target.classList.add('is-visible');
        revealObserver.unobserve(entry.target);
      });
    }, { rootMargin: '0px 0px -8% 0px', threshold: 0.08 });

    revealTargets.forEach(function (target) {
      target.classList.add('section-reveal');
      revealObserver.observe(target);
    });
  }
})();
</script>
<script type="module">
  if (document.querySelector('[data-hero-cells]')) {
    import('./assets/hero-cells.js');
  }
</script>
